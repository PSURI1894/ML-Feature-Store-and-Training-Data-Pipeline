[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-platform"
version = "0.1.0"
description = "Production ML Feature Store & Training Data Pipeline (offline + online, point-in-time correct)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parth Suri", email = "parthsuri009@gmail.com" }]
keywords = ["feature-store", "feast", "mlops", "point-in-time", "feature-engineering"]

dependencies = [
    "feast[redis,gcp,snowflake,aws]>=0.36,<0.41",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "redis>=5.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "mlflow>=2.11",
    "great-expectations>=0.18",
    "scipy>=1.11",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
flink = ["apache-flink>=1.18"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.1",
    "freezegun>=1.4",
    "moto>=5.0",
    "fakeredis>=2.21",
]

[project.scripts]
fp = "feature_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --cov=feature_platform --cov-report=term-missing"
markers = [
    "integration: requires external services (redis, warehouse)",
    "pit: point-in-time correctness invariants",
]
