name: feature-validation

# Enforces the "Definition of Done" for feature views on every PR that touches
# the feature repo: ownership, SLA, sensitivity, naming, and transform tests.

on:
  pull_request:
    paths:
      - "feature_repo/**"
      - "src/feature_platform/registry/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate feature definitions (owner / SLA / naming / sensitivity)
        run: python -m feature_platform.registry.validation --strict

      - name: Unit-test transformation logic
        run: pytest tests/unit -k "transform or feature_view" -v

      - name: Detect breaking schema changes (require version bump)
        run: python -m feature_platform.registry.validation --check-compat origin/develop

      - name: Comment plan on PR
        if: always()
        run: python -m feature_platform.registry.validation --plan >> "$GITHUB_STEP_SUMMARY"
